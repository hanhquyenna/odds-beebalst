# Supabase CLI settings for this project (ukpmpyfcnbhngkgbnkxi). Only what differs from the defaults is written here.
project_id = "careerapp2"

# Edge Functions: three, routed by sub-path (see each index.ts). Deploying with the CLI reads these, so CI keeps the
# same settings as the live project.

# Signing in: called before anyone is signed in (Google through Shoo, guest accounts, a phone opening a QR code). It
# checks what it needs itself: the Shoo token, a one-time code, a rate limit.
[functions.account]
verify_jwt = false

# The person's own profile; the gateway checks the token first (the anon key passes, for a LinkedIn import before sign-in).
[functions.profile]
verify_jwt = true

# The job list: pg_cron (a secret header), anyone adding a job (a global limit), and signed-in calls that check the
# token themselves (welcome, people).
[functions.jobs]
verify_jwt = false
