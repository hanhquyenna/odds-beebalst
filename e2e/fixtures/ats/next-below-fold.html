<!doctype html><html><head><meta charset="utf-8"></head><body><main><h1>Intern</h1>
<form onsubmit="event.preventDefault()">
  <label for="fn">First name</label>
  <input id="fn" required>
  <div style="height:2400px"></div>
  <button type="button" id="next" hidden aria-label="Next"><svg viewBox="0 0 8 8" width="8" height="8"></svg></button>
</form>
<script>
function reveal() {
  const top = window.scrollY || (document.scrollingElement && document.scrollingElement.scrollTop) || 0
  if (top > 80) document.getElementById("next").hidden = false
}
window.addEventListener("scroll", reveal)
</script></main></body></html>
