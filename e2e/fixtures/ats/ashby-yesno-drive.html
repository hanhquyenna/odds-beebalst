<!doctype html><html><head><meta charset="utf-8"></head><body><main><h1>Data Intern</h1>
<form onsubmit="event.preventDefault()">
  <div class="entry"><label class="_heading_1x">Have you trained a language model yourself?</label>
    <div class="yesno" id="auth">
      <button type="button" class="_option_1x" aria-pressed="false">Yes</button>
      <button type="button" class="_option_1x" aria-pressed="false">No</button>
      <input type="checkbox" tabindex="-1" aria-hidden="true">
    </div>
  </div>
  <button type="submit">Submit Application</button>
</form></main>
<script>
for (const g of document.querySelectorAll(".yesno")) for (const b of g.querySelectorAll("button")) b.addEventListener("click", () => {
  for (const o of g.querySelectorAll("button")) { o.classList.remove("_active_1x"); o.setAttribute("aria-pressed", "false") }
  b.classList.add("_active_1x"); b.setAttribute("aria-pressed", "true")
})
</script></body></html>
