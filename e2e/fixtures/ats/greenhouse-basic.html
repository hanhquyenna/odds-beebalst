<!doctype html><html><body><h1>Junior Consultant — Application</h1>
<form id="application_form">
  <div class="field"><label for="n">First name *</label><input id="n" name="job_application[first_name]" required></div>
  <label>Last name<input name="family" required></label>
  <label>Email<input type="email" name="job_application[email]" required></label>
  <label>Phone<input type="tel" name="job_application[phone]" required></label>
  <!-- ReactSelect-style country (options appear when opened) -->
  <div class="field" data-qa="country">
    <label id="country-label">Country *</label>
    <div class="select__control" id="country-control" role="combobox" aria-labelledby="country-label" aria-expanded="false" tabindex="0">
      <div class="select__value" id="country-value">Select…</div>
      <input id="country-input" aria-autocomplete="list" style="opacity:0;width:1px;height:1px" />
    </div>
    <ul class="select__menu" id="country-menu" hidden role="listbox">
      <li role="option" data-value="Netherlands">Netherlands</li>
      <li role="option" data-value="Belgium">Belgium</li>
      <li role="option" data-value="Germany">Germany</li>
    </ul>
    <input type="hidden" id="country-hidden" name="job_application[country]" required value="">
  </div>
  <label>Resume/CV<input id="resume" type="file" name="resume" accept=".pdf,.doc,.docx" required></label>
  <div class="field" id="extra" hidden>
    <label for="motivation">Why this role? *</label>
    <textarea id="motivation" name="job_application[answers][0]" required></textarea>
  </div>
  <label><input type="checkbox" name="job_application[data_compliance]"> I agree to the privacy policy *</label>
  <button type="button" id="next">Next</button>
  <button type="submit">Submit application</button>
</form>
<script>
window.sent = 0
document.getElementById("application_form").addEventListener("submit", e => { e.preventDefault(); window.sent++ })
const control = document.getElementById("country-control")
const menu = document.getElementById("country-menu")
const valueEl = document.getElementById("country-value")
const hidden = document.getElementById("country-hidden")
control.addEventListener("click", () => {
  menu.hidden = !menu.hidden
  control.setAttribute("aria-expanded", menu.hidden ? "false" : "true")
})
for (const opt of menu.querySelectorAll("[role=option]")) {
  opt.addEventListener("click", () => {
    valueEl.textContent = opt.getAttribute("data-value")
    hidden.value = opt.getAttribute("data-value")
    menu.hidden = true
    control.setAttribute("aria-expanded", "false")
    document.getElementById("extra").hidden = false
  })
}
document.getElementById("next").addEventListener("click", () => {
  document.getElementById("extra").hidden = false
})
</script>
</body></html>
