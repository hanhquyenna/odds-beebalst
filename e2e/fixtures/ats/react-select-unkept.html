<!doctype html><html><head><meta charset="utf-8"></head><body><main><h1>Intern</h1>
<form onsubmit="event.preventDefault()">
  <div class="select__container">
    <label id="team-l" for="team">Preferred team</label>
    <div class="select__control">
      <div class="select__value-container">
        <div class="select__single-value" id="sv"></div>
        <input id="team" role="combobox" aria-autocomplete="list" aria-controls="team-menu" aria-labelledby="team-l" aria-invalid="false">
      </div>
    </div>
    <div id="team-menu" role="listbox" hidden></div>
  </div>
  <button type="submit">Submit</button>
</form>
<script>
// The search box takes text, but the choice lives only in the single-value sibling. Nothing here ever writes it,
// so a fill that trusts the input looks done and is not.
const input = document.getElementById("team")
input.addEventListener("input", () => {
  if (input.value && !document.getElementById("sv").textContent) input.setAttribute("aria-invalid", "true")
})
</script></main></body></html>
