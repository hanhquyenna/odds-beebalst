<!doctype html><html><head><meta charset="utf-8"></head><body><main><h1>Intern</h1>
<form onsubmit="event.preventDefault()">
  <label for="start">Start date</label>
  <input id="start" placeholder="MM/YYYY" aria-invalid="false" required>
  <button type="submit">Submit</button>
</form>
<script>
const input = document.getElementById("start")
input.addEventListener("input", () => {
  input.setAttribute("aria-invalid", /^\d{2}\/\d{4}$/.test(input.value) ? "false" : "true")
})
</script></main></body></html>
