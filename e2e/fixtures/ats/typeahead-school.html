<!doctype html><html><head><meta charset="utf-8"></head><body><main><h1>Intern</h1>
<form onsubmit="event.preventDefault()">
  <div class="select__container">
    <label id="school-l" for="school">University</label>
    <div class="select__control">
      <div class="select__value-container">
        <div class="select__single-value" id="sv"></div>
        <input id="school" role="combobox" aria-autocomplete="list" aria-controls="menu" aria-labelledby="school-l">
      </div>
    </div>
    <div id="menu" role="listbox" hidden></div>
  </div>
  <button type="submit">Submit</button>
</form>
<script>
const OPTIONS = ["Vrije Universiteit Amsterdam", "University of Amsterdam"]
const input = document.getElementById("school")
const menu = document.getElementById("menu")
const sv = document.getElementById("sv")
input.addEventListener("input", () => {
  const q = input.value.trim().toLowerCase()
  const hits = q.length >= 3 && q.length <= 12 ? OPTIONS.filter((o) => o.toLowerCase().includes(q)) : []
  menu.innerHTML = ""
  menu.hidden = hits.length === 0
  for (const h of hits) {
    const row = document.createElement("div")
    row.setAttribute("role", "option")
    row.textContent = h
    row.addEventListener("mousedown", (e) => {
      e.preventDefault()
      sv.textContent = h
      input.value = ""
      input.setAttribute("aria-invalid", "false")
      menu.hidden = true
    })
    menu.appendChild(row)
  }
  if (!sv.textContent && input.value) input.setAttribute("aria-invalid", "true")
})
</script></main></body></html>
