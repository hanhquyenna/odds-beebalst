<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>odds · Jobs in the Netherlands, found for you</title>
    <meta name="description" content="Tell us your permit and background. We read the jobs employers post across the Netherlands and show you the ones you can take, what they pay and what you keep after tax. Free to use." />
    <meta name="theme-color" content="#fdfcfb" />
    <!-- The jobs come from Supabase on every first paint: open that connection while the scripts download. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- The body text font, otherwise found only after the stylesheet arrives. -->
    <link rel="preload" as="font" type="font/woff2" href="/node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2" crossorigin />
    <!-- iPhones get a manifest without a start address, so the Home Screen app opens the address it was added from,
         which carries the one-time code that signs it in. Chosen here, before the page loads, so Safari reads the right one. -->
    <!-- External file, not inline: the Content-Security-Policy forbids inline scripts. -->
    <script src="/manifest-pick.js"></script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="odds" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
